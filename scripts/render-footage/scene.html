<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>

<body>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

const params = new URLSearchParams(location.search);
const SCENE = params.get("scene") || "hero";
const W = +(params.get("w") || 1280), H = +(params.get("h") || 720);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Deterministic PRNG
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

// Grade pass: vignette + slight chromatic aberration + film grain (seeded by frame)
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: 1.0 }, uCA: { value: 0.0012 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uVig; uniform float uCA; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime*13.17) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5;
      float d = length(c);
      vec2 o = c * uCA * (1.0 + d*4.0);
      vec3 col = vec3(texture2D(tDiffuse, vUv + o).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - o).b);
      col *= mix(1.0, smoothstep(0.85, 0.2, d), uVig);
      col += (h(vUv*vec2(1280.0,720.0)) - 0.5) * 0.035;
      gl_FragColor = vec4(col, 1.0);
    }`,
};

function makeComposer(scene, camera, bloom) {
  const rt = new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType });
  const composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  const b = new UnrealBloomPass(new THREE.Vector2(W, H), bloom.strength, bloom.radius, bloom.threshold);
  composer.addPass(b);
  composer.addPass(new OutputPass());
  const grade = new ShaderPass(GradeShader);
  composer.addPass(grade);
  return { composer, grade, bloom: b };
}

// ---------- Procedural "shots" painted on canvas, used as film-frame footage ----------
const PALETTES = [
  ["#05070b", "#1b2330", "#c9d2e0"], // silver dusk
  ["#04060a", "#0d2a35", "#6fe3ff"], // electric cyan
  ["#06070a", "#1d2a12", "#d4ff4a"], // lime glow
  ["#050505", "#2a2a2e", "#f2f2f2"], // mono
];
function paintShot(g, w, h, i) {
  seed = 1000 + i * 31;
  const p = PALETTES[i % PALETTES.length];
  const kind = i % 5;
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, p[0]); sky.addColorStop(0.62, p[1]); sky.addColorStop(1, p[0]);
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  const hz = h * (0.55 + rnd() * 0.12);
  // sun / light source
  const sx = w * (0.2 + rnd() * 0.6), sy = hz - h * (0.05 + rnd() * 0.18), sr = h * (0.05 + rnd() * 0.08);
  const glow = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 6);
  glow.addColorStop(0, p[2]); glow.addColorStop(0.12, p[2] + "aa"); glow.addColorStop(1, "transparent");
  g.fillStyle = glow; g.fillRect(0, 0, w, h);
  if (kind === 0 || kind === 3) {
    // mountain ridges
    for (let layer = 0; layer < 3; layer++) {
      g.beginPath(); g.moveTo(0, h);
      let y = hz - h * 0.1 * (2 - layer) * rnd();
      for (let x = 0; x <= w; x += w / 24) { y += (rnd() - 0.5) * h * 0.08; g.lineTo(x, Math.min(h, y + layer * h * 0.06)); }
      g.lineTo(w, h); g.closePath();
      g.fillStyle = `rgba(4,5,8,${0.55 + layer * 0.2})`; g.fill();
    }
  } else if (kind === 1) {
    // city skyline
    let x = 0;
    while (x < w) {
      const bw = w * (0.02 + rnd() * 0.05), bh = h * (0.08 + rnd() * 0.3);
      g.fillStyle = "#030406"; g.fillRect(x, hz - bh, bw, bh + h);
      g.fillStyle = p[2] + "55";
      for (let wy = hz - bh + 6; wy < hz - 4; wy += 9) for (let wx = x + 3; wx < x + bw - 3; wx += 7) if (rnd() > 0.7) g.fillRect(wx, wy, 2, 3);
      x += bw + 1;
    }
    g.fillStyle = "#020304"; g.fillRect(0, hz, w, h);
  } else if (kind === 2) {
    // ocean with light path
    g.fillStyle = "#03050a"; g.fillRect(0, hz, w, h - hz);
    for (let yy = hz; yy < h; yy += 3) {
      const k = (yy - hz) / (h - hz);
      g.fillStyle = p[2] + Math.floor(clamp(0.5 - k * 0.4) * 255).toString(16).padStart(2, "0");
      const span = w * (0.02 + k * 0.25) * (0.6 + rnd() * 0.8);
      g.fillRect(sx - span / 2 + (rnd() - 0.5) * 20, yy, span, 1.5);
    }
  } else {
    // portrait silhouette against light
    g.fillStyle = "#020305";
    g.beginPath(); g.ellipse(w * 0.5, h * 0.42, w * 0.07, h * 0.15, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(w * 0.5, h * 1.0, w * 0.22, h * 0.42, 0, 0, Math.PI * 2); g.fill();
  }
  // letterbox-ish grade
  const vg = g.createRadialGradient(w / 2, h / 2, h * 0.2, w / 2, h / 2, w * 0.7);
  vg.addColorStop(0, "transparent"); vg.addColorStop(1, "rgba(0,0,0,0.65)");
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
}

function frameTexture(i) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 288;
  const g = c.getContext("2d");
  paintShot(g, 512, 288, i);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

// ================= HERO: film ribbon -> wall of vertical reels =================
function buildHero() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#020306");
  scene.fog = new THREE.FogExp2("#020306", 0.035);
  const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 300);

  const cols = 16, rows = 6;
  const N = cols * rows;
  const FW = 1.6, FH = 0.9;
  const RW = FH * 9 / 16, RH = FH;
  const pts = [];
  for (let k = 0; k <= 44; k++) pts.push(new THREE.Vector3(k * 4.2 - 1, Math.sin(k * 0.42) * 0.9, -Math.sin(k * 0.3) * 3.5 - k * 0.55));
  const curve = new THREE.CatmullRomCurve3(pts);
  const LEN = curve.getLength();
  const gap = 1.74;
  const textures = Array.from({ length: 24 }, (_, i) => frameTexture(i));
  const perfMat = new THREE.MeshStandardMaterial({ color: "#0b0d12", roughness: 0.35, metalness: 0.85 });
  const perfGeo = new THREE.PlaneGeometry(FW + 0.14, FH + 0.36);
  const holeGeo = new THREE.PlaneGeometry(0.055, 0.075);
  const holeMat = new THREE.MeshBasicMaterial({ color: "#8a93a6" });
  const GLIDE_END = 0.15;
  const WALL = curve.getPointAt(GLIDE_END + 0.02).add(new THREE.Vector3(0, 0.25, -5));
  const frames = [];
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < N; i++) {
    const tex = textures[i % textures.length].clone();
    tex.needsUpdate = true;
    const mat = new THREE.MeshStandardMaterial({ map: tex, emissiveMap: tex, emissive: new THREE.Color("#ffffff"), emissiveIntensity: 1.15, roughness: 0.3, metalness: 0.1 });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    const group = new THREE.Group();
    const perf = new THREE.Group();
    const pm = new THREE.Mesh(perfGeo, perfMat); pm.position.z = -0.01; perf.add(pm);
    for (let s = -1; s <= 1; s += 2) for (let hx = 0; hx < 14; hx++) {
      const hole = new THREE.Mesh(holeGeo, holeMat);
      hole.position.set(-FW / 2 + 0.06 + hx * (FW / 13.6), s * (FH / 2 + 0.1), -0.005);
      perf.add(hole);
    }
    group.add(perf); group.add(mesh); scene.add(group);
    const u = clamp((i * gap) / LEN, 0, 0.999);
    const p = curve.getPointAt(u), T = curve.getTangentAt(u);
    const n = new THREE.Vector3().crossVectors(T, up).normalize();
    const b = new THREE.Vector3().crossVectors(n, T).normalize();
    const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(T, b, n));
    const c = i % cols, r = Math.floor(i / cols);
    const wall = WALL.clone().add(new THREE.Vector3((c - (cols - 1) / 2) * (RW + 0.12), ((rows - 1) / 2 - r) * (RH + 0.14), 0));
    const dist = p.distanceTo(wall);
    frames.push({ group, mesh, perf, mat, tex, p, q, n, wall, dist });
  }
  const maxD = Math.max(...frames.map((f) => f.dist));
  frames.forEach((f) => (f.delay = (f.dist / maxD) * 0.55 + rnd() * 0.08));
  // dust
  const P = 2200; const pos = new Float32Array(P * 3);
  for (let i = 0; i < P; i++) { pos[i*3] = rnd() * 70 - 10; pos[i*3+1] = (rnd() - 0.5) * 14; pos[i*3+2] = -rnd() * 40 + 8; }
  const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(pg, new THREE.PointsMaterial({ color: "#b8ccff", size: 0.03, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(dust);
  scene.add(new THREE.AmbientLight("#8090a8", 0.3));
  const key = new THREE.PointLight("#bfe9ff", 30, 25); scene.add(key);
  const rim = new THREE.PointLight("#d4ff4a", 12, 40); rim.position.set(20, -2, -16); scene.add(rim);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: "#05060a", roughness: 0.22, metalness: 0.9 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -2.4; scene.add(floor);
  const fx = makeComposer(scene, camera, { strength: 0.8, radius: 0.55, threshold: 0.5 });
  const qWall = new THREE.Quaternion();
  const f0 = frames[0];
  return function render(t, frameIndex) {
    const pull = ease(smooth(0.0, 0.32, t));
    const glide = ease(smooth(0.12, 0.72, t));
    const form = smooth(0.5, 0.94, t);
    for (const f of frames) {
      const ke = ease(clamp((form - f.delay * 0.7) / 0.3));
      // arc lift as frames fly to the wall
      const lift = Math.sin(ke * Math.PI) * 1.2;
      f.group.position.lerpVectors(f.p, f.wall, ke);
      f.group.position.y += lift * 0.8; f.group.position.z -= lift * 1.6;
      f.group.quaternion.slerpQuaternions(f.q, qWall, ke);
      f.group.rotateY(Math.sin(ke * Math.PI) * 0.7);
      const w = lerp(FW, RW, ke), hh = lerp(FH, RH, ke);
      f.mesh.scale.set(w, hh, 1);
      const rep = lerp(1, (RW / RH) / (FW / FH), ke);
      f.tex.repeat.set(rep, 1); f.tex.offset.set((1 - rep) / 2, 0);
      f.perf.scale.set(lerp(1, (RW + 0.05) / (FW + 0.14), ke), lerp(1, (RH + 0.05) / (FH + 0.36), ke), 1);
      f.perf.visible = ke < 0.97;
    }
    // camera: macro on frame 0 -> pull back -> truck along strip -> settle on wall
    const macro = f0.p.clone().addScaledVector(f0.n, 0.85);
    const gu = clamp(0.012 + glide * (GLIDE_END - 0.012));
    const gp = curve.getPointAt(gu);
    const along = gp.clone().add(new THREE.Vector3(-0.8, 0.55, 3.9));
    const wallCam = WALL.clone().add(new THREE.Vector3(0, 0, 9.2));
    const cpos = new THREE.Vector3().lerpVectors(macro, along, pull).lerp(wallCam, ease(form));
    camera.position.copy(cpos);
    const lookAlong = curve.getPointAt(clamp(gu + 0.03));
    const look = new THREE.Vector3().lerpVectors(f0.p, lookAlong, pull).lerp(WALL, ease(form));
    camera.lookAt(look);
    camera.rotateZ(-0.06 * Math.sin(clamp(t / 0.7) * Math.PI));
    camera.fov = lerp(30, 38, pull) - 2 * ease(form);
    camera.updateProjectionMatrix();
    key.position.copy(camera.position).add(new THREE.Vector3(1.5, 2, -1));
    dust.position.x = -t * 3;
    fx.bloom.strength = 0.65 + 0.45 * form;
    fx.grade.uniforms.uTime.value = frameIndex * 0.37;
    fx.composer.render();
  };
}

// ================= RIDGE: seamless looping dusk terrain flythrough =================
function buildRidge() {
  const scene = new THREE.Scene();
  const fogCol = new THREE.Color("#0a0f16");
  scene.background = fogCol;
  scene.fog = new THREE.Fog(fogCol, 6, 46);
  const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);
  const L = 24; // loop period along z
  const uniforms = { uOff: { value: 0 }, uFog: { value: fogCol }, uSun: { value: new THREE.Color("#bfe6ff") } };
  const geo = new THREE.PlaneGeometry(90, 90, 280, 280);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `
      uniform float uOff; varying float vH; varying vec3 vW; varying vec3 vN;
      const float TAU = 6.28318530718; const float L = ${L.toFixed(1)};
      float hgt(vec2 p){
        float z = p.y + uOff;
        float h = 0.0;
        h += sin(z*TAU/L*1.0 + p.x*0.21) * 1.6;
        h += sin(z*TAU/L*2.0 - p.x*0.43 + 1.3) * 0.8;
        h += sin(z*TAU/L*5.0 + p.x*0.9 + 0.7) * 0.28;
        h += sin(z*TAU/L*9.0 - p.x*1.7) * 0.10;
        float valley = smoothstep(0.0, 9.0, abs(p.x));
        return h * valley + valley*valley*3.2 - 1.2;
      }
      void main(){
        vec3 p = position;
        p.y = hgt(p.xz);
        float e = 0.08;
        vec3 n = normalize(vec3(hgt(p.xz - vec2(e,0.0)) - hgt(p.xz + vec2(e,0.0)), 2.0*e, hgt(p.xz - vec2(0.0,e)) - hgt(p.xz + vec2(0.0,e))));
        vH = p.y; vN = n;
        vec4 w = modelMatrix * vec4(p,1.0); vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform vec3 uFog; uniform vec3 uSun; varying float vH; varying vec3 vW; varying vec3 vN;
      void main(){
        vec3 L = normalize(vec3(-0.2, 0.35, -1.0));
        float diff = clamp(dot(normalize(vN), L), 0.0, 1.0);
        float rim = pow(1.0 - clamp(normalize(vN).y,0.0,1.0), 2.0);
        vec3 base = mix(vec3(0.015,0.02,0.03), vec3(0.09,0.11,0.14), smoothstep(-1.0, 4.0, vH));
        vec3 col = base + uSun * diff * 0.55 + vec3(0.83,1.0,0.29) * rim * 0.05 * smoothstep(1.0,4.0,vH);
        // contour lines (topographic, subtle)
        float c = abs(fract(vH*2.2) - 0.5);
        col += vec3(0.55,0.75,0.95) * smoothstep(0.03, 0.0, c) * 0.08;
        float d = length(vW - cameraPosition);
        float f = smoothstep(6.0, 46.0, d);
        col = mix(col, uFog, f);
        gl_FragColor = vec4(col, 1.0);
        #include <colorspace_fragment>
      }`,
  });
  const terrain = new THREE.Mesh(geo, mat);
  terrain.position.z = -30;
  scene.add(terrain);
  // sky dome gradient + sun
  const sky = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: `varying vec3 vP; void main(){
      float y = vP.y;
      vec3 top = vec3(0.01,0.012,0.02); vec3 hz = vec3(0.04,0.06,0.085);
      vec3 col = mix(hz, top, smoothstep(0.0, 0.5, y));
      vec3 sd = normalize(vec3(-0.2, 0.06, -1.0));
      float s = max(dot(vP, sd), 0.0);
      col += vec3(0.75,0.88,1.0) * pow(s, 900.0) * 6.0;
      col += vec3(0.5,0.7,0.95) * pow(s, 30.0) * 0.35;
      col += vec3(0.83,1.0,0.3) * pow(s, 6.0) * 0.03;
      gl_FragColor = vec4(col,1.0);
      #include <colorspace_fragment>
    }`,
  }));
  scene.add(sky);
  // floating motes
  const P = 900; const pos = new Float32Array(P * 3);
  for (let i = 0; i < P; i++) { pos[i*3] = (rnd()-0.5)*30; pos[i*3+1] = rnd()*6; pos[i*3+2] = -rnd()*40; }
  const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const motes = new THREE.Points(pg, new THREE.PointsMaterial({ color: "#cfe8ff", size: 0.03, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(motes);
  const fx = makeComposer(scene, camera, { strength: 0.6, radius: 0.7, threshold: 0.7 });
  return function render(t, frameIndex) {
    uniforms.uOff.value = -t * L; // exactly one period per loop
    const s = Math.sin(t * Math.PI * 2);
    camera.position.set(s * 0.6, 2.3 + Math.cos(t * Math.PI * 2) * 0.15, 6);
    camera.lookAt(s * 0.3, 1.2, -20);
    camera.rotateZ(s * 0.025);
    motes.position.z = ((t * 40) % 40);
    fx.grade.uniforms.uTime.value = frameIndex * 0.37;
    fx.composer.render();
  };
}

const render = SCENE === "ridge" ? buildRidge() : buildHero();
window.renderAt = (i, n) => { render(n > 1 ? i / (SCENE === "ridge" ? n : n - 1) : 0, i); return true; };
window.capture = () => renderer.domElement.toDataURL("image/jpeg", 0.95);
window.ready = true;
</script>
</body>
</html>
